  - Playable terminal Tetris and working loopback web/chat apps ship with bounded cooperative polling. No SRS/hold/seven-bag game guideline or production network service guarantee is claimed.
  - CLI networking is opt-in POSIX numeric IPv4 TCP with a 256-open-socket registry, bounded native waits and explicit close/shutdown. DNS/IPv6/UDP/TLS/task-level await and a C network-provider grant API remain pending.
  - HTTP is one strict bounded HTTP/1.1 exchange per connection with pinned picohttpparser. Chunking/keep-alive/custom headers/interim responses/compression are not implemented. A separate browser UI now ships; peer framing/size failures are IO errors while allocation/step/provider-contract limits stay fatal.
  - CLI step limits are disabled by default and explicitly enabled with --steps N; embedding defaults remain bounded. Object budget and explicit game/server GC remain independent.
  - Pac-Man reuses legacy maze/navigation rules rather than claiming an exact arcade emulator. Browser clients share one local session and best score is not persisted.
  - Browser canvas/control/layout tests ran through live Playwright tools, not an installed headless browser dependency in make test. Assets are startup snapshots requiring server restart after edits.
  - Legacy workspace IntelliSense misidentifies C++17 variant/optional in the runtime header; explicit C++17 builds validate it without changing the parent editor configuration.
  - The currently attached editor language server predates Sockets and reports an undeclared name in the new UI script; rebuilt checker and live LSP gates pass. DotK 3 Restart Language Server refreshes that stale process; editor-host restart was not automated.
  - Chat accepts up to32 local peers and 2KiB messages with complete-line UTF-8 framing. Interactive draft editing is ASCII; authentication/encryption/persistence/rate limiting are not implemented.
  - Terminal input is bounded native polling, not task-level await; raw byte sequences require decoding. Restoration covers normal CLI/error paths, not SIGKILL or arbitrary signal termination.
  - Object is a logical universal non-null annotation/root, not primitive boxing. Error kinds are nominal enum values; legacy unknown String categories normalize to Application.
  - F-string replacements are parsed expressions with containing-literal diagnostics; Python formatting specs/conversion flags are not implemented.
  - IO line reads and delays are host-callback based, bounded and blocking; C embedding defaults do not grant input/timing/network callbacks. Socket/HTTP providers remain trusted, not a sandbox.
  - Conversion hooks execute only for script-facing top-level conversion; nested structural/debugger/reflection/error formatting does not execute user methods.
  - Operator hooks dispatch on the left operand only; equality/hash/truthiness/reflected protocols remain separate. Indexed get/set hooks now ship; collection membership/equality semantics are unchanged.
  - Conditional Map callbacks use null-as-absence/removal semantics and do not roll back script effects; these are not concurrent atomic operations.
  - Core constructors/collection subclasses/Set/visibility are integrated; advanced class generics/variance remain extensions. Constructor side effects are not transactional.
  - Visibility is lexical encapsulation, not a sandbox against trusted host/native code; authorized private callable delegation remains possible.
  - Set storage is insertion-ordered and linear, not a hash performance claim. Native collection copying/slicing returns base types, not implicit subclass reconstruction.
  - Callback collection operations take eager shallow snapshots; source/element side effects are not rolled back. Map result contracts require explicit annotation; dynamic callback signatures remain runtime checked.
  - Random defaults to seed 0 per VM and uses standard distributions/engine for same-build replay; it is not cryptographic or a portable cross-version stream format.
  - JSON uses unchanged pinned parser header shared with LSP; SAX conversion/depth/byte/step bounds are not a total memory/wall-clock sandbox. Serialization estimates are conservative.
  - Owned collections/callbacks/resources and versioned module registration are implemented; dynamic loading/editor manifests remain pending. Handles require release and DK3Call contexts must not escape.
  - Resource disposal is explicit or reverse-order owner-thread shutdown, not GC. Open state is separately bounded; external payload bytes and native cleanup remain trusted and not preemptible.
  - Files is read-only and disabled by default; trusted host providers enforce their own policy. CLI root checks/open are TOCTOU-racy and native I/O is not preemptible or a sandbox.
  - String matching is exact without normalization/graphemes/regex. Split/join are eager and budget-checked; native work is not wall-clock preemptible and generator side effects are not rolled back.
  - Anonymous call checks use direct literals and immutable literal bindings; mutable/aliased/dynamically returned signatures remain conservative.
  - Collection searches are linear; reverse preflights script budgets but native array work is not wall-clock preemptible. Map get returns null for both absent and stored-null values.
  - List extension stages eager temporary storage; source side effects/consumed yields are not rolled back. Array insertion/removal shift items.
  - Map membership/removal use linear scans; keys/values are eager shallow typed snapshots not lazy views or deep copies.
  - LSP member hover and dot-completion implemented; general navigation/completion/full inference remain pending.
  - Qualified imported annotations are runtime-resolved; cross-module static export inference remains pending.
  - Full rewrite not complete; README coverage matrix is authoritative.
  - Tests use thirteen groups including real network journeys and CLI/editor/LSP checks, not a claim of thirteen total assertions.
  - Full VS Code editor-host interaction not automated; activation mocks and actual stream transport passed.
  - npm dependencies had no known advisory findings; vendored C++ JSON review was best effort and not a security certification.
  - New native C HTTP parser review used model-knowledge fallback because the available CVE tool accepts only Maven/NuGet/npm. Empty findings are best effort, not a live advisory scan or security certification.
  - Static data checks use known lexical declarations; full inference generics and cross-module typing remain pending.
  - Editor assets were validated structurally and by regex syntax; rendered VS Code highlighting was not visually verified.
  - Debugger exception stops watch evaluation expandable objects C adapter and DAP remain pending.
  - CLI history is in-session only; persistent history tab completion and Ctrl-C cleanup remain pending.
  - CLI depends on system libedit on macOS/Linux; Windows currently uses plain line input.
  - Flat implicit function aliases were removed intentionally; use capitalized namespaces or explicit from imports. List/Map type constructors remain bare.
  - Legacy init hooks remain compatible; custom constructors use independent synchronous Null-returning signatures and checked required field initialization.
  - Nominal trait defaults and record implementations are supported; generics inheritance associated types variance and builtin extensions remain pending.
  - Docstrings preserve written whitespace; Javadoc tags field docs and documentation generation are not implemented.
  - Cleanup is bounded best effort; native callbacks and allocation failures are not preempted.
  - ASan not run due previously established local runtime startup problem; UBSan passed.
  - Optional tooling, full static typing, await and worker channels, bytecode optimization and additional capability libraries remain pending.
  - Raylib/database/process libraries and native binary loading are not implemented.
